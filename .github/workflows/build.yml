name: Build Android APK

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Ensure permanent debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
            git config user.email "action@github.com"
            git config user.name "GitHub Action"
            git add app/debug.keystore
            git commit -m "Add permanent debug keystore"
            git push
          fi
          mkdir -p ~/.android
          cp app/debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AvansReport.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: AvansReport 2.0 (build ${{ github.run_number }})
          files: app/build/outputs/apk/debug/AvansReport.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
